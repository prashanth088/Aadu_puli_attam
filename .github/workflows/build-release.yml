name: Build Windows EXE

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pygame
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame

      - name: Install PyInstaller
        run: |
          python -m pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name Aadu-Puli-Aattam main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Aadu-Puli-Aattam-Windows
          path: dist/Aadu-Puli-Aattam.exe
